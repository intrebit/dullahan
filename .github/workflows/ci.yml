name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: cargo fmt --check
        working-directory: server
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: server
        run: cargo clippy --locked --all-targets -- -D warnings

  server:
    name: server (cargo test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dullahan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dullahan_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build
        working-directory: server
        run: cargo build --locked
      - name: Test
        working-directory: server
        run: cargo test --locked
      - name: Verify server boots and migrations apply
        working-directory: server
        env:
          BIND_ADDR: 127.0.0.1:3001
        run: |
          cargo run --locked --bin dullahan &
          PID=$!
          for i in $(seq 1 30); do
            sleep 1
            curl -fsS http://127.0.0.1:3001/health && break
          done
          kill $PID

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: audit
      - name: install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        working-directory: server
        # RUSTSEC-2023-0071: rsa Marvin attack. Pulled in only via sqlx-mysql
        # at compile time (sqlx-macros). We enable only the postgres feature,
        # so rsa code is never linked into the runtime binary.
        run: cargo audit --ignore RUSTSEC-2023-0071

  tracker:
    name: tracker (vitest + vendored pt.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tracker/package-lock.json
      - working-directory: tracker
        run: npm ci
      - working-directory: tracker
        run: npm run typecheck
      - working-directory: tracker
        run: npm test
      - working-directory: tracker
        run: npm run build
      # Option A: the server compiles in server/assets/pt.js and serves it at
      # /pt.js. Fail if the committed asset has drifted from a fresh build.
      - name: vendored pt.js is fresh
        run: diff -q tracker/dist/pt.js server/assets/pt.js

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dullahan_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dullahan_e2e
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install e2e deps
        working-directory: e2e
        run: npm ci
      - name: install playwright chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: run e2e
        working-directory: e2e
        run: npx playwright test

  docker:
    name: docker (build + smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dullahan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dullahan:ci ./server
      - name: Run + smoke (/health, /pt.js)
        run: |
          docker run -d --name dullahan --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/dullahan \
            -e ADMIN_TOKEN=ci-token \
            -e BIND_ADDR=127.0.0.1:3001 \
            dullahan:ci
          for i in $(seq 1 30); do sleep 1; curl -fsS http://127.0.0.1:3001/health && break; done
          curl -fsS http://127.0.0.1:3001/health
          # /pt.js must serve the real vendored tracker (the global is window.dullahan)
          curl -fsS http://127.0.0.1:3001/pt.js | grep -q 'dullahan' && echo "pt.js OK"
          docker logs dullahan
          docker rm -f dullahan

  # Push to master, all six gates green -> build a release binary here and install
  # it on the server. The binary is the only artifact: sqlx::migrate! embeds the
  # migrations, so nothing else needs to travel.
  #
  # Requires four repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
  # DEPLOY_KNOWN_HOSTS (and optionally DEPLOY_PORT). Without them the job fails
  # fast on the guard below instead of hanging on an SSH prompt. One-time server
  # setup is in docs/deploy.md.
  deploy:
    name: deploy (master -> server)
    needs: [lint, server, tracker, audit, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Pinned, not ubuntu-latest: the binary must run against the server's glibc,
    # so build on an image no newer than it. 22.04 ships glibc 2.35, old enough
    # for Debian 12 (2.36) and Ubuntu 22.04+. Bump only alongside the server.
    runs-on: ubuntu-22.04
    # Add required reviewers to this environment in repo settings if you ever
    # want a push to master to wait for a click before it reaches production.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Check deploy secrets are configured
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()
          [[ -n "$HOST" ]]        || missing+=(DEPLOY_HOST)
          [[ -n "$USER_" ]]       || missing+=(DEPLOY_USER)
          [[ -n "$KEY" ]]         || missing+=(DEPLOY_SSH_KEY)
          [[ -n "$KNOWN_HOSTS" ]] || missing+=(DEPLOY_KNOWN_HOSTS)
          if ((${#missing[@]})); then
            echo "missing repo secrets: ${missing[*]} — see docs/deploy.md" >&2
            exit 1
          fi
      - name: Build release binary
        working-directory: server
        run: |
          cargo build --release --locked --bin dullahan
          strip target/release/dullahan
          ls -lh target/release/dullahan
      - name: Install on the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Through env rather than ${{ }} interpolation: a key containing shell
          # metacharacters would otherwise be pasted into the script body.
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key, so a hijacked DNS record cannot collect the key.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH_OPTS=(-i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "${PORT:-22}")
          scp "${SSH_OPTS[@]}" server/target/release/dullahan "$USER_@$HOST:/tmp/dullahan.new"
          # Installs, restarts, health-checks, and rolls back on failure; a red
          # step here means the previous version is still serving.
          ssh "${SSH_OPTS[@]}" "$USER_@$HOST" "sudo /usr/local/bin/dullahan-deploy /tmp/dullahan.new"
      # dullahan-deploy already health-checked the service on the box; this only
      # confirms the public route (DNS, CDN, Caddy, TLS) still reaches it. Set
      # the DEPLOY_HEALTH_URL secret to your public /health — skipped if unset,
      # since the SSH host is usually not the public hostname.
      - name: Verify the public endpoint
        if: ${{ secrets.DEPLOY_HEALTH_URL != '' }}
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: curl -fsS --retry 5 --retry-delay 2 "$HEALTH_URL"
